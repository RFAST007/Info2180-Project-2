<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="add.css">
    <script src="add.js"></script>
</head>
<body>
    <header>
        <div id="root">
            <div class="header-file">🐬 Dolphin CRM</div>
        </div>
    </header>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <ul class="side-menu">
            <li class="side-item">
                <div class="side-icon"><i class="fas fa-home"></i></div>
                <span>Home</span>
            </li>
            <li class="side-item active">
                <div class="side-icon"><i class="fas fa-address-book"></i></div>
                <span>New Contact</span>
            </li>
            <li class="side-item">
                <div class="side-icon"><i class="fas fa-users"></i></div>
                <span>Users</span>
            </li>
            <li class="side-item logout">
                <div class="side-icon"><i class="fas fa-sign-out-alt"></i></div>
                <span>Logout</span>
            </li>
        </ul>
    </aside>
    <!-- Main Content -->
    <main class="main-content">
        <!-- Success/Error Messages -->
        <div id="message" class="message"></div>
        <h3 class="form-title">New User</h3>
        <!-- Form Container -->
        <div class="form-container">
            <form id="userForm" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName" class="required">First Name</label>
                        <input type="text" id="firstName" class="form-control" placeholder="June" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName" class="required">Last Name</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="somethings@example.com" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="required">Password</label>
                        <div class="password-container">
                            <input type="password" id="password" class="form-control" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="required">User Type</label>
                        <div class="role-selector">
                            <div class="role-option">
                                <input type="radio" id="member" name="role" class="role-radio" value="member" checked>
                                <label for="member">Member</label>
                            </div>
                            <div class="role-option">
                                <input type="radio" id="admin" name="role" class="role-radio" value="admin">
                                <label for="admin">Admin</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Save User
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
